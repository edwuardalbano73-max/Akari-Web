<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>Akari Web 🌸</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="flowers">
    🌸　🌷　🌸　🌺　🌸　🌷　🌸
</div>
<main class="login-container">
    <div class="login-card">
        <div class="logo">
            🌸
        </div>
        <h1>Akari Web</h1>
        <p class="subtitle">
            Panel privado de Akari Bot
        </p>
        <div class="divider"></div>
        <label for="password">
            🔐 Contraseña
        </label>
        <input
            type="password"
            id="password"
            placeholder="Introduce la contraseña..."
            autocomplete="current-password"
        >
        <button id="loginButton">
            Entrar al panel 🌸
        </button>
        <p id="message" class="status"></p>
    </div>
</main>
<script src="/script.js"></script>
</body>
</html>
