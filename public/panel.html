<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Akari Panel 🌸</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="flowers">
    🌸　🌷　🌸　🌺　🌸　🌷　🌸
</div>

<main class="dashboard">

    <header class="topbar">

        <div>
            <h1>
                🌸 Akari Bot
            </h1>

            <p>
                Panel de administración
            </p>
        </div>

        <button
            id="logoutButton"
            class="logout"
        >
            Salir
        </button>

    </header>

    <section class="welcome-card">

        <h2>
            🌸 Dashboard
        </h2>

        <p id="guildName">
            Cargando servidor...
        </p>

    </section>

    <div class="grid">

        <section class="config-card">

            <h2>
                💰 Economía
            </h2>

            <label>Work — tiempo</label>
            <input
                id="workTime"
                placeholder="30m"
            >

            <label>Work — mínimo</label>
            <input
                id="workMin"
                type="number"
            >

            <label>Work — máximo</label>
            <input
                id="workMax"
                type="number"
            >

            <hr>

            <h3>
                🎲 Slut / Azar
            </h3>

            <label>Tiempo</label>
            <input
                id="slutTime"
                placeholder="1h"
            >

            <label>Mínimo</label>
            <input
                id="slutMin"
                type="number"
            >

            <label>Máximo</label>
            <input
                id="slutMax"
                type="number"
            >

            <label>Probabilidad</label>
            <input
                id="slutWin"
                type="number"
                min="0"
                max="100"
            >

        </section>

        <section class="config-card">

            <h2>
                🔪 Crime
            </h2>

            <label>Tiempo</label>
            <input
                id="crimeTime"
                placeholder="2h"
            >

            <label>Mínimo</label>
            <input
                id="crimeMin"
                type="number"
            >

            <label>Máximo</label>
            <input
                id="crimeMax"
                type="number"
            >

            <label>Probabilidad</label>
            <input
                id="crimeWin"
                type="number"
                min="0"
                max="100"
            >

            <hr>

            <h2>
                🥷 Rob
            </h2>

            <label>Tiempo</label>
            <input
                id="robTime"
                placeholder="30m"
            >

            <label>Probabilidad</label>
            <input
                id="robWin"
                type="number"
                min="0"
                max="100"
            >

        </section>

        <section class="config-card">

            <h2>
                🎁 Daily
            </h2>

            <label>Cantidad</label>
            <input
                id="dailyAmount"
                type="number"
            >

            <label>Tiempo</label>
            <input
                id="dailyTime"
                placeholder="24h"
            >

            <hr>

            <h2>
                🎴 Juego
            </h2>

            <label>Tiempo BJ</label>
            <input
                id="bjTime"
                placeholder="2m"
            >

            <label>Probabilidad BJ</label>
            <input
                id="bjWin"
                type="number"
                min="0"
                max="100"
            >

        </section>

        <section class="config-card">

            <h2>
                🛒 Shop
            </h2>

            <div id="shopList"></div>

            <input
                id="shopName"
                placeholder="Nombre del producto"
            >

            <input
                id="shopPrice"
                type="number"
                placeholder="Precio"
            >

            <input
                id="shopDescription"
                placeholder="Descripción"
            >

            <button
                id="addShop"
                class="secondary"
            >
                ➕ Agregar producto
            </button>

        </section>

        <section class="config-card">

            <h2>
                📋 Logs
            </h2>

            <label>
                Canal de logs
            </label>

            <input
                id="logsChannel"
                placeholder="ID del canal"
            >

            <label class="switch-row">
                <input
                    type="checkbox"
                    id="logsEnabled"
                >
                Activar logs
            </label>

        </section>

        <section class="config-card">

            <h2>
                🌸 Bienvenidas
            </h2>

            <label class="switch-row">
                <input
                    type="checkbox"
                    id="welcomeEnabled"
                >
                Activar
            </label>

            <label>
                Canal
            </label>

            <input
                id="welcomeChannel"
                placeholder="ID del canal"
            >

            <label>
                Mensaje
            </label>

            <textarea
                id="welcomeMessage"
            ></textarea>

        </section>

        <section class="config-card">

            <h2>
                👋 Despedidas
            </h2>

            <label class="switch-row">
                <input
                    type="checkbox"
                    id="goodbyeEnabled"
                >
                Activar
            </label>

            <label>
                Canal
            </label>

            <input
                id="goodbyeChannel"
                placeholder="ID del canal"
            >

            <label>
                Mensaje
            </label>

            <textarea
                id="goodbyeMessage"
            ></textarea>

        </section>

        <section class="config-card">

            <h2>
                🔒 Seguridad
            </h2>

            <label class="switch-row">
                <input
                    type="checkbox"
                    id="antiLink"
                >
                Anti-links
            </label>

            <label class="switch-row">
                <input
                    type="checkbox"
                    id="antiSpam"
                >
                Anti-spam
            </label>

            <label>
                Límite de spam
            </label>

            <input
                id="spamLimit"
                type="number"
                min="2"
                max="20"
            >

        </section>

        <section class="config-card">

            <h2>
                🤖 Auto
            </h2>

            <label class="switch-row">
                <input
                    type="checkbox"
                    id="autoEnabled"
                >
                Activar respuestas
            </label>

            <p class="small">
                Las respuestas automáticas se configurarán aquí.
            </p>

        </section>

    </div>

    <button
        id="saveButton"
        class="save-button"
    >
        💾 Guardar todos los cambios
    </button>

    <p
        id="statusMessage"
        class="status"
    ></p>

</main>

<script src="script.js"></script>

</body>
</html>
